<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AJAX Example</title>
</head>
<body>
    <p id="demo">AJAX change this text.</p>
    <button type="button" onclick="loadDoc()">Change Content</button>
    <script>
        function loadDoc() {
            // Create a new XMLHttpRequest object
            var xhttp = new XMLHttpRequest();
            // Define the function to be called when the readyState changes
            xhttp.onreadystatechange = function() {
         // Check if the request is complete (readyState is 4) and successful (status is 200)
                if (this.readyState == 4 && this.status == 200) {
                    // Update the content of the paragraph with the ID 'demo'
                    document.getElementById("demo").innerHTML = this.responseText;
                }
            };
            // Initialize the request
            xhttp.open("GET", "labone.php", true);

            // Send the request
            xhttp.send();
        }
    </script>
</body>
</html>
